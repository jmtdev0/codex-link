# nginx site for a self-hosted Link origin. Replace LINK_HOST with the public
# host name (for example 203-0-113-7.sslip.io) before installing.
limit_req_zone $binary_remote_addr zone=link_api:10m rate=4r/s;

server {
    # "listen ... http2" works on nginx 1.24 (Ubuntu 24.04); 1.25+ also accepts "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name LINK_HOST;

    ssl_certificate     /etc/letsencrypt/live/LINK_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/LINK_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /link/v1/ {
        limit_req zone=link_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 40s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
